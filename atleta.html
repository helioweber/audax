<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Atleta</title>
    <style>
        body { 
            background: #121212; color: white; font-family: sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0;
        }
        .btn-enviar {
            width: 200px; height: 200px; border-radius: 50%; border: none;
            background: #27ae60; color: white; font-weight: bold; font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(39, 174, 96, 0.4); cursor: pointer;
            active: transform: scale(0.95);
        }
        #msg { margin-top: 30px; font-size: 0.9rem; color: #bbb; text-align: center; padding: 0 20px; }
    </style>
</head>
<body>

    <button class="btn-enviar" onclick="enviarPosicao()">REPORTAR<br>POSIÇÃO</button>
    <div id="msg">Toque no botão para enviar sua localização atual.</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://xtawaddkssnwdigsniuw.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0YXdhZGRrc3Nud2RpZ3NuaXV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxODk0NTksImV4cCI6MjEwMjc2NTQ1OX0.ef949wMDXluhu8yYeljbfNPWe-Rn4a034XQuMj7FUx8";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function enviarPosicao() {
            const btn = document.querySelector('.btn-enviar');
            const msg = document.getElementById('msg');
            
            btn.disabled = true;
            btn.style.background = "#555";
            msg.innerText = "Obtendo GPS...";

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude, longitude, altitude, speed } = pos.coords;

                const { error } = await supabaseClient.from('posicoes').insert([
                    { 
                        lat: latitude, 
                        lng: longitude, 
                        altitude: altitude, 
                        velocidade: speed,
                        desafio_id: 'brm600'
                    }
                ]);

                if (error) {
                    msg.innerText = "Erro no banco: " + error.message;
                    btn.style.background = "#e74c3c";
                } else {
                    msg.innerText = "Sucesso! Enviado às " + new Date().toLocaleTimeString();
                    btn.style.background = "#27ae60";
                }
                btn.disabled = false;
            }, (err) => {
                msg.innerText = "Erro de GPS: " + err.message;
                btn.style.background = "#e74c3c";
                btn.disabled = false;
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
